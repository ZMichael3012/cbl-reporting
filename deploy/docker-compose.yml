name: cbl-reporting
services:

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports: ["9092:9092"]
    networks: [cbl-net]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward_transitive
    ports: ["8081:8081"]
    networks: [cbl-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: cbl
      CLICKHOUSE_PASSWORD: cbl
      CLICKHOUSE_DB: reporting
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      # Каталог форматов монтируется read-only; entrypoint пропускает chown
      # (volume остается записываемым для серверного процесса).
      CLICKHOUSE_DO_NOT_CHOWN: "1"
    volumes:
      - ch-data:/var/lib/clickhouse
      # Wire-схема конвейера читается сервером ClickHouse из format_schema_path
      # (Kafka engine запрещает абсолютный путь в format_schema).
      - ./format_schemas:/schemas:ro
      - ./clickhouse-config/10-format-schema-path.xml:/etc/clickhouse-server/config.d/10-format-schema-path.xml:ro
    ports: ["8123:8123", "9000:9000"]
    networks: [cbl-net]
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user cbl --password cbl --query 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
  reporting:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: cbl-reporting/Dockerfile
    environment:
      HTTP_ADDR: ":8110"
      GRPC_ADDR: ":9110"
      METRICS_ADDR: ":9310"
      CLICKHOUSE_DSN: clickhouse://cbl:cbl@clickhouse:9000/reporting
      KAFKA_BROKERS: kafka:29092
      SCHEMA_PATH: events.proto
      MIGRATIONS_DIR: /app/migrations
    ports:
      - "8110:8110"
      - "9110:9110"
      - "9310:9310"
    depends_on:
      kafka: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    networks: [cbl-net]

volumes:
  kafka-data:
  ch-data:

networks:
  cbl-net:
    driver: bridge
