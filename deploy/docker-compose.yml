name: cbl-reporting
services:

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports: ["9092:9092"]
    networks: [cbl-net]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward_transitive
    ports: ["8081:8081"]
    networks: [cbl-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: cbl
      CLICKHOUSE_PASSWORD: cbl
      CLICKHOUSE_DB: reporting
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      # The formats directory is mounted read-only; the entrypoint skips chown
      # (the volume stays writable for the server process).
      CLICKHOUSE_DO_NOT_CHOWN: "1"
    volumes:
      - ch-data:/var/lib/clickhouse
      # The pipeline wire schema is read by the ClickHouse server from format_schema_path
      # (the Kafka engine forbids an absolute path in format_schema).
      - ./format_schemas:/schemas:ro
      - ./clickhouse-config/10-format-schema-path.xml:/etc/clickhouse-server/config.d/10-format-schema-path.xml:ro
    ports: ["8123:8123", "9000:9000"]
    networks: [cbl-net]
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user cbl --password cbl --query 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
  # ledger-stub - a test Ledger for the dim_accounts vocabulary and check (e2e);
  # not part of the production contour. The admin HTTP is published for
  # entry seeding from the e2e script, gRPC is available only inside the network.
  ledger-stub:
    build:
      context: ..
      dockerfile: test/e2e/.additionals/ledgerstub/Dockerfile
    environment:
      STUB_GRPC_ADDR: ":9040"
      STUB_HTTP_ADDR: ":9041"
      STUB_MERCHANT_REF: "m-1"
    # The stub gRPC listens on loopback (local run of the service binary),
    # the admin seed as well: nothing is published to the stand network beyond
    # the internal addresses (test contour, not production).
    ports: ["127.0.0.1:9040:9040", "127.0.0.1:9041:9041"]
    networks: [cbl-net]
  reporting:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8110"
      GRPC_ADDR: ":9110"
      METRICS_ADDR: ":9310"
      CLICKHOUSE_DSN: clickhouse://cbl:cbl@clickhouse:9000/reporting
      KAFKA_BROKERS: kafka:29092
      SCHEMA_PATH: events.proto
      MIGRATIONS_DIR: /app/migrations
      # Vocabulary and check on the stand: accelerated intervals and a short window
      # so the e2e fits in minutes (not carried over to production).
      LEDGER_GRPC_ADDR: ledger-stub:9040
      DIM_REFRESH_INTERVAL: 5s
      LEDGER_CHECK_INTERVAL: 5s
      LEDGER_CHECK_WINDOW: 15s
    ports:
      - "8110:8110"
      # gRPC (Query) in dev is published only on loopback: without authN (mTLS - 0.6)
      # the port must not be reachable from the network (KI-reporting-13).
      - "127.0.0.1:9110:9110"
      - "9310:9310"
    depends_on:
      kafka: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      ledger-stub: { condition: service_started }
    networks: [cbl-net]

  # grafana - business dashboards (CBL-11.5): provisioning and dashboards are
  # mounted read-only (as code); the plugin is baked into the image. The port is
  # loopback-only: the stand has no SSO/authN (KI-reporting-14), production
  # deployment and authentication are out of scope (0.6/0.7).
  # Admin credentials: admin / cbl (GF_SECURITY_ADMIN_PASSWORD, dev stand only).
  grafana:
    profiles: ["app"]
    build:
      context: .
      dockerfile: grafana/Dockerfile
    environment:
      GF_SECURITY_ADMIN_PASSWORD: cbl
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      clickhouse: { condition: service_healthy }
    networks: [cbl-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  kafka-data:
  ch-data:

networks:
  cbl-net:
    driver: bridge
