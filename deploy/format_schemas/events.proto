// Wire decoding schema of CBL events for the ClickHouse Kafka engine (CBL-11.2).
// The schema is a wire-compatible flattening of the billing/events/v1 and
// billing/common/v1 contracts from cbl-protos@cf-4: names and packages do not
// matter for the wire format, field numbers and types are preserved; unused
// fields are omitted (the decoder skips unknown wire fields, numbers are never
// reused per buf rules).
// Imports are not used: ClickHouse does not resolve imports between schema files,
// and google.protobuf.Timestamp does not map to DateTime64, so Timestamp is
// decoded as Tuple(seconds, nanos) and converted in the materialized view.
// The file is mounted into the ClickHouse format_schema_path (service compose and
// testcontainers); SCHEMA_PATH sets the path relative to format_schema_path
// (the Kafka engine forbids an absolute path).
syntax = "proto3";

package cbl.reporting.schemas;

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

message Money {
  int64 minor_units = 1;
  string asset = 2;
  uint32 decimals = 3;
}

message PaymentRow {
  string payment_id = 1;
  string merchant_id = 2;
  Money expected_amount = 4;
  Money received_amount = 5;
  Money fee = 6;
  string quote_id = 7;
  string rate = 8;
  string txid = 9;
  uint64 state_version = 10;
  Timestamp occurred_at = 11;
  string provider = 12;
  string raw_status = 13;
  Money gateway_fee = 14;
  Money network_fee = 15;
  Money fx_spread = 16;
}

message LedgerEntryRow {
  string account_id = 1;
  int32 direction = 2;
  Money amount = 3;
}

message LedgerRow {
  string transaction_id = 1;
  int32 type = 2;
  string ref_type = 3;
  string ref_id = 4;
  repeated LedgerEntryRow entries = 5;
  Timestamp occurred_at = 6;
}

message PayoutRow {
  string payout_id = 1;
  string merchant_id = 2;
  int32 type = 3;
  Money amount = 4;
  Money fee = 5;
  string txid = 6;
  string provider = 7;
  string failure_reason = 8;
  uint64 state_version = 9;
  Timestamp occurred_at = 10;
  string refund_invoice_id = 11;
}

message ReconAlertRow {
  string alert_id = 1;
  int32 type = 2;
  string ref_id = 3;
  int32 severity = 4;
  string expected = 5;
  string actual = 6;
  Timestamp created_at = 7;
  string merchant_id = 8;
}
